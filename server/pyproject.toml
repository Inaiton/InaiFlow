[project]
name = "inaiflow-server"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "email-validator>=2.4.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.121",
    "fpdf2>=2.9.0",
    "httpx>=0.28.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "pyotp>=2.12.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "sqlalchemy[asyncio]>=2.0.36",
]

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests", "app/modules"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions/0001_baseline.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008", "S608", "E501", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "B017"]
"app/modules/*/tests/**" = ["S101", "S105", "S106", "S311"]
"migrations/**" = ["S608"]
"app/seeds/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "migrations", "tests"]
