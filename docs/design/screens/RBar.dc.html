<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>InaiFlow · Button bar</title>
<script src="./support.js"></script>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F9F9FB}
a{color:#3538CD}a:hover{color:#2D31A6}
</style>
</helmet>
<nav aria-label="Function keys" style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; padding: 6px; border-radius: 14px; background: #F4F4F6; font-family: 'Google Sans Flex','Google Sans',Inter,system-ui,sans-serif; font-size: 12px">
  <sc-for list="{{items}}" as="b" hint-placeholder-count="14">
    <sc-if value="{{b.sep}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="height: 1px; background: #D0D5DD; margin: 5px 4px"></span></sc-if>
    <sc-if value="{{b.btn}}" hint-placeholder-val="{{ true }}">
      <a href="{{b.href}}" style="display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px; background: {{b.bg}}; border: 1px solid {{b.bd}}; text-decoration: none; color: {{b.color}}; font-weight: {{b.weight}}">
        <span style="min-width: 40px; font-size: 10.5px; font-weight: 700; color: {{b.kc}}">{{b.k}}</span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{b.label}}</span>
      </a>
    </sc-if>
  </sc-for>
</nav>
</x-dc>
