name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Contract is regenerated
        run: python docs/api/gen_openapi.py --check

  server:
    runs-on: ubuntu-latest
    needs: contract
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      APP_ENV: test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Create owner role
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE inaiflow_owner LOGIN PASSWORD 'inaiflow_owner' CREATEDB;"
          psql -h localhost -U postgres -c "CREATE ROLE inaiflow_app NOLOGIN NOBYPASSRLS;"
          psql -h localhost -U postgres -c "GRANT inaiflow_app TO inaiflow_owner;"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run lint-imports
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://inaiflow_owner:inaiflow_owner@localhost:5432/inaiflow_test_ci

  web:
    runs-on: ubuntu-latest
    needs: contract
    strategy:
      matrix:
        app: ["@inaiflow/user-web", "@inaiflow/admin-web"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ${{ matrix.app }} gen:api
      - name: Generated API types are committed
        run: git diff --exit-code -- client
      - run: pnpm --filter ${{ matrix.app }} lint
      - run: pnpm --filter ${{ matrix.app }} typecheck
      - run: pnpm --filter ${{ matrix.app }} test
      - run: pnpm --filter ${{ matrix.app }} build
